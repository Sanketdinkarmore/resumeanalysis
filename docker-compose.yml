services:
  postgres:
    image: postgres:16-alpine
    container_name: jri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jri
      POSTGRES_PASSWORD: jri
      POSTGRES_DB: jri
    ports:
      - "5432:5432"
    volumes:
      - jri_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jri -d jri"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jri-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jri_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: jri-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jriminio
      MINIO_ROOT_PASSWORD: jriminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jri_minio_data:/data

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: jri-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: development
      PORT: 8000
      INTERNAL_API_SECRET: local-dev-internal-secret-change-me

  # Full app stack — enable with: docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jri-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    # OAuth secrets + any local overrides — see apps/api/.env.example
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://jri:jri@postgres:5432/jri?schema=public
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: jriminio
      S3_SECRET_ACCESS_KEY: jriminio123
      S3_BUCKET: resumes
      S3_FORCE_PATH_STYLE: "true"
      AI_SERVICE_URL: http://ai:8000
      INTERNAL_API_SECRET: local-dev-internal-secret-change-me
      # Host port mapping — browser OAuth callback stays on localhost:4000
      GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ai:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: jri-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

volumes:
  jri_pg_data:
  jri_redis_data:
  jri_minio_data:
